name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      TESTAPPIO_API_TOKEN: ${{ secrets.TESTAPPIO_API_TOKEN }}
      TESTAPPIO_APP_ID_ANDROID: ${{ secrets.TESTAPPIO_APP_ID_ANDROID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: npm install

      - name: Add and Sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android Version & Permissions
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          echo "Configuring Android Version: $VERSION_NAME (build $VERSION_CODE)"
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/versionCode 1/versionCode $VERSION_CODE/" "$GRADLE_FILE"
            sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/" "$GRADLE_FILE"
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FinTrack.apk
          ls -lh FinTrack.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-Android-APK
          path: FinTrack.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to TestApp.io
        if: env.TESTAPPIO_API_TOKEN != '' && env.TESTAPPIO_APP_ID_ANDROID != ''
        uses: testappio/github-action@v5
        continue-on-error: true
        with:
          api_token: ${{ secrets.TESTAPPIO_API_TOKEN }}
          app_id: ${{ secrets.TESTAPPIO_APP_ID_ANDROID }}
          file: FinTrack.apk
          git_release_notes: true
          notify: true
  build-ios:
    runs-on: macos-latest
    env:
      TESTAPPIO_API_TOKEN: ${{ secrets.TESTAPPIO_API_TOKEN }}
      TESTAPPIO_APP_ID_IOS: ${{ secrets.TESTAPPIO_APP_ID_IOS }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Add and Sync Capacitor iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Configure iOS Version
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          echo "Configuring iOS Version: $VERSION_NAME (build $VERSION_CODE)"
          cd ios/App
          xcrun agvtool new-marketing-version "$VERSION_NAME" || true
          xcrun agvtool new-version -all "$VERSION_CODE" || true

      - name: Build iOS App with Xcode
        run: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr FinTrack.ipa Payload
          ls -lh FinTrack.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-iOS-IPA
          path: FinTrack.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload IPA to TestApp.io
        if: env.TESTAPPIO_API_TOKEN != '' && env.TESTAPPIO_APP_ID_IOS != ''
        uses: testappio/github-action@v5
        continue-on-error: true
        with:
          api_token: ${{ secrets.TESTAPPIO_API_TOKEN }}
          app_id: ${{ secrets.TESTAPPIO_APP_ID_IOS }}
          file: FinTrack.ipa
          git_release_notes: true
          notify: true

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List Artifacts
        run: ls -lh

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-latest
          name: "FinTrack Mobile Apps (Latest)"
          body: |
            Automated mobile build of FinTrack.
            
            - **Android APK**: `FinTrack.apk` (install on Android or upload to testapp.io)
            - **iOS IPA**: `FinTrack.ipa` (upload to testapp.io or install via AltStore/Sideloadly)
          files: |
            FinTrack.apk
            FinTrack.ipa
          draft: false
          prerelease: false
