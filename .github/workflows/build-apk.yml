name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: npm install

      - name: Add and Sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions & Network Security
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FinTrack.apk
          ls -lh FinTrack.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-Android-APK
          path: FinTrack.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Add and Sync Capacitor iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr FinTrack.ipa Payload
          ls -lh FinTrack.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-iOS-IPA
          path: FinTrack.ipa
          if-no-files-found: error
          retention-days: 30

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List Artifacts
        run: ls -lh

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-latest
          name: "FinTrack Mobile Apps (Latest)"
          body: |
            Automated mobile build of FinTrack.
            
            - **Android APK**: `FinTrack.apk` (install on Android or upload to testapp.io)
            - **iOS IPA**: `FinTrack.ipa` (upload to testapp.io or install via AltStore/Sideloadly)
          files: |
            FinTrack.apk
            FinTrack.ipa
          draft: false
          prerelease: false
